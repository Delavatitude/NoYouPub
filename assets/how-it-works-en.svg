<svg xmlns="http://www.w3.org/2000/svg" width="640" height="216" viewBox="0 0 640 216" role="img" aria-labelledby="diagram-title diagram-description" xml:lang="en">
  <title id="diagram-title">Browser → Mac → TV</title>
  <desc id="diagram-description">You choose a video in the browser. The Mac prepares and streams it. The TV plays the video in its own player.</desc>
  <rect x="1" y="1" width="638" height="214" rx="22" fill="#15121e" stroke="#332a44" stroke-width="2"/>
  <g fill="none" stroke="#957eae" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M193 61h45m-8-7 8 7-8 7"/>
    <path d="M402 61h45m-8-7 8 7-8 7"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(112 0)">
      <g transform="translate(0 61)" fill="none" stroke="#c4a6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-29" y="-22" width="58" height="44" rx="7"/><path d="M-29 -10H29 M-21 -16h.1 M-14 -16h.1 M-3 -3l12 7-12 7z"/>
      </g>
      <text y="124" fill="#faf6ff" font-size="29" font-weight="700">Browser</text>
      <text fill="#d7cde5" font-size="24" font-weight="500"><tspan x="0" y="158">Choose</tspan><tspan x="0" y="186">your video</tspan></text>
    </g>
    <g transform="translate(320 0)">
      <g transform="translate(0 61)" fill="none" stroke="#c4a6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-25 13v-32a4 4 0 0 1 4-4h42a4 4 0 0 1 4 4v32m-22 0h28v4a6 6 0 0 1-6 6h-50a6 6 0 0 1-6-6v-4H3m-9 4H6"/>
      </g>
      <text y="124" fill="#faf6ff" font-size="29" font-weight="700">Mac</text>
      <text fill="#d7cde5" font-size="24" font-weight="500"><tspan x="0" y="158">Prepares and</tspan><tspan x="0" y="186">streams the video</tspan></text>
    </g>
    <g transform="translate(528 0)">
      <g transform="translate(0 61)" fill="none" stroke="#c4a6ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-30" y="-23" width="60" height="41" rx="6"/><path d="M0 18v7m-11 0h22M-5-10l14 8-14 8z"/>
      </g>
      <text y="124" fill="#faf6ff" font-size="29" font-weight="700">TV</text>
      <text fill="#d7cde5" font-size="24" font-weight="500"><tspan x="0" y="158">Plays the video</tspan><tspan x="0" y="186">in its own player</tspan></text>
    </g>
  </g>
</svg>
