  <radialGradient id="halo"><stop stop-color="#754af4" stop-opacity=".37"/><stop offset="1" stop-color="#754af4" stop-opacity="0"/></radialGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd8aff"/><stop offset=".6" stop-color="#8654ff"/><stop offset="1" stop-color="#6735d4"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26213f"/><stop offset="1" stop-color="#0d0b1b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/>
<circle cx="900" cy="204" r="300" fill="url(#halo)"/>
<g opacity=".12" stroke="#aa92ff" stroke-width="1"><path d="M0 66H1200 M0 133H1200 M0 200H1200 M0 267H1200 M0 334H1200 M80 0V430 M160 0V430 M240 0V430 M320 0V430 M400 0V430 M480 0V430 M560 0V430 M640 0V430 M720 0V430 M800 0V430 M880 0V430 M960 0V430 M1040 0V430 M1120 0V430"/></g>
