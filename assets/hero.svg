<circle cx="86" cy="78.5" r="4" fill="#af84ff"/><text x="98" y="83" font-size="12" fill="#d7c7ff" font-weight="bold" letter-spacing="1.5">MACOS APP</text>
<text x="64" y="176" font-size="66" fill="#ffffff" font-weight="bold" letter-spacing="-2">NoYouPub</text>
